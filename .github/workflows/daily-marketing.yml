name: Daily marketing drafts
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
permissions:
  contents: write
  issues: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate research and draft
        run: python agent/run.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || (git commit -m "Add daily marketing research" && git push)
      - name: Create approval issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls -t output/daily-*.md | head -1)
          gh issue create --title "Review marketing drafts — $(date -u +%F)" --body-file "$FILE" || true
