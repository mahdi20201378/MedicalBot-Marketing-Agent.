name: On-demand content delivery

on:
  push:
    branches: [main]
    paths:
      - 'outbox/*.md'

permissions:
  contents: read

jobs:
  deliver-new-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the committed content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing TELEGRAM_CHAT_ID"; exit 1; }

      - name: Deliver newly committed Markdown files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^outbox/[^/]+\.md$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No new outbox Markdown files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Sending $file"
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${file};type=text/markdown" \
              -F "caption=ChatGPT-created marketing content — please review before publishing."
          done
